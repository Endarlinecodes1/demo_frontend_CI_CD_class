<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A small note-taking app with search, tags, pinning, and local persistence.">
  <title>Notes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Notes">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span class="brand-text">Notes</span>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <label class="sr-only" for="search">Search notes</label>
        <input id="search" type="search" placeholder="Search notes and tags..." autocomplete="off">
        <kbd id="search-shortcut">Ctrl K</kbd>
      </div>

      <div class="topbar-actions">
        <button id="new-note" class="btn btn-primary" type="button" aria-label="New note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span>New note</span>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>
        <button id="export-btn" class="icon-btn" type="button" aria-label="Export notes" title="Export notes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"></path>
          </svg>
        </button>
        <button id="import-btn" class="icon-btn" type="button" aria-label="Import notes" title="Import notes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15V3m0 0 4 4m-4-4L8 7M4 17v3h16v-3"></path>
          </svg>
        </button>
        <input id="import-input" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main class="main">
      <section class="toolbar" aria-label="Note filters">
        <div class="filter-group" role="group" aria-label="Filter notes">
          <button class="filter-btn is-active" data-filter="all" type="button">All <span data-count="all">0</span></button>
          <button class="filter-btn" data-filter="pinned" type="button">Pinned <span data-count="pinned">0</span></button>
          <button class="filter-btn" data-filter="tagged" type="button">Tagged <span data-count="tagged">0</span></button>
        </div>

        <div class="sort-group">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="updated">Recently updated</option>
            <option value="created">Recently created</option>
            <option value="title">Title A-Z</option>
          </select>
        </div>
      </section>

      <section id="results">
        <div id="notes-grid" class="notes-grid"></div>

        <div id="empty-state" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h11l3 3v13H5z"></path>
            <path d="M8 9h8M8 13h8M8 17h5"></path>
          </svg>
          <h2 id="empty-title">No notes yet</h2>
          <p id="empty-message">Create your first note and it will show up here.</p>
          <button id="empty-action" class="btn btn-primary" type="button">Create a note</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span id="note-count" aria-live="polite">0 notes</span>
      <span>Saved locally in your browser</span>
    </footer>
  </div>

  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="editor-title">
    <form id="note-form" class="editor-form" novalidate>
      <div class="dialog-header">
        <div>
          <p id="editor-mode" class="eyebrow">New note</p>
          <h2 id="editor-title">Write something down</h2>
        </div>
        <button id="close-editor" class="icon-btn" type="button" aria-label="Close editor">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" maxlength="100" placeholder="Untitled note" autocomplete="off" aria-describedby="form-error">
      </div>

      <div class="field">
        <label for="tags">Tags <span class="hint">comma separated</span></label>
        <input id="tags" name="tags" type="text" placeholder="work, ideas, personal" autocomplete="off">
      </div>

      <div class="field field-grow">
        <div class="label-row">
          <label for="content">Note</label>
          <span id="char-count" class="hint">0 characters</span>
        </div>
        <textarea id="content" name="content" rows="11" placeholder="Start writing..." aria-describedby="form-error"></textarea>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="dialog-footer">
        <button id="cancel-editor" class="btn btn-ghost" type="button">Cancel</button>
        <button id="save-note" class="btn btn-primary" type="submit">Save note</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>
</body>
</html>
